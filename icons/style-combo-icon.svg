<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Style Combo Generator icon</title>
  <desc id="desc">A clean dark app icon with a bright three-part style spark and SCG initials.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11142b"/>
      <stop offset="0.55" stop-color="#26123a"/>
      <stop offset="1" stop-color="#070612"/>
    </linearGradient>
    <linearGradient id="spark" x1="160" y1="96" x2="352" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#71f6ff"/>
      <stop offset="0.48" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#f9d56e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="196" r="112" fill="rgba(255,255,255,0.06)"/>
    <path d="M256 82l30 86 90 4-70 54 24 88-74-50-74 50 24-88-70-54 90-4 30-86Z" fill="url(#spark)"/>
    <path d="M256 142l16 46 48 2-38 28 14 48-40-28-40 28 14-48-38-28 48-2 16-46Z" fill="#070612" opacity="0.72"/>
  </g>

  <g fill="#fffaf4" font-family="ui-rounded, SF Pro Rounded, Segoe UI, system-ui, sans-serif" font-weight="1000" text-anchor="middle">
    <text x="256" y="392" font-size="92" letter-spacing="-6">SCG</text>
  </g>
</svg>
